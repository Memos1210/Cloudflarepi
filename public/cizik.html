<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Günlük Karalama</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        #canvas-container {
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
            background: #ffffff;
        }
        canvas {
            display: block;
            cursor: crosshair;
            touch-action: none; /* Sayfa kaydırmasını engeller, sadece çizime odaklar */
        }
        .status {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="cizimAlani" width="350" height="350"></canvas>
    </div>
    <div class="status" id="durumMesaji">Çizim yapın, bırakınca otomatik kaydedilir.</div>

    <script>
        const canvas = document.getElementById('cizimAlani');
        const ctx = canvas.getContext('2d');
        const durumMesaji = document.getElementById('durumMesaji');
        
        // Günlük anahtar (Her gün için farklı bir kayıt tutmak üzere yyyy-mm-dd formatı)
        const bugun = new Date().toISOString().split('T')[0];
        const depoAnahtari = `cizik_kayit_${bugun}`;

        let ciziliyor = false;

        // Çizim çizgisi ayarları
        ctx.strokeStyle = '#333333';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // Sayfa yüklendiğinde bugüne ait eski çizim varsa yükle
        window.addEventListener('load', () => {
            const kaydedilenCizim = localStorage.getItem(depoAnahtari);
            if (kaydedilenCizim) {
                const img = new Image();
                img.onload = () => ctx.drawImage(img, 0, 0);
                img.src = kaydedilenCizim;
                durumMesaji.innerText = "Bugünün karalaması yüklendi.";
            }
        });

        // Koordinat alma fonksiyonu (Dokunmatik ve Fare uyumlu)
        function koordinatAl(e) {
            const rect = canvas.getBoundingClientRect();
            // Eğer dokunmatik ekransa ilk parmak konumunu al, değilse fare konumunu al
            const istemciX = e.touches ? e.touches[0].clientX : e.clientX;
            const istemciY = e.touches ? e.touches[0].clientY : e.clientY;
            
            return {
                x: istemciX - rect.left,
                y: istemciY - rect.top
            };
        }

        // Çizimi Başlat
        function baslat(e) {
            ciziliyor = true;
            const { x, y } = koordinatAl(e);
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        // Çizimi Sürdür
        function ciz(e) {
            if (!ciziliyor) return;
            e.preventDefault(); // Dokunmatik ekranda ekranın kaymasını önler
            
            const { x, y } = koordinatAl(e);
            ctx.lineTo(x, y);
            ctx.stroke();
        }

        // Çizimi Bitir ve Otomatik Kaydet
        function bitir() {
            if (!ciziliyor) return;
            ciziliyor = false;
            
            // Çizim bittiği an LocalStorage'a kaydet
            try {
                const veriUrl = canvas.toDataURL();
                localStorage.setItem(depoAnahtari, veriUrl);
                durumMesaji.innerText = "Değişiklikler otomatik kaydedildi!";
                
                // Mesajı 2 saniye sonra normale döndür
                setTimeout(() => {
                    durumMesaji.innerText = "Çizim yapın, bırakınca otomatik kaydedilir.";
                }, 2000);
            } catch (hata) {
                console.error("Kayıt başarısız:", hata);
            }
        }

        // --- Etkinlik Dinleyicileri (Event Listeners) ---

        // Dokunmatik (Mobil) Etkinlikleri
        canvas.addEventListener('touchstart', baslat, { passive: false });
        canvas.addEventListener('touchmove', ciz, { passive: false });
        canvas.addEventListener('touchend', bitir);

        // Fare (Masaüstü) Etkinlikleri
        canvas.addEventListener('mousedown', baslat);
        canvas.addEventListener('mousemove', ciz);
        canvas.addEventListener('mouseup', bitir);
        canvas.addEventListener('mouseleave', bitir); // Fare kutudan çıkarsa da kaydet

    </script>
</body>
</html>
